name: E2E (Playwright)

# E2E against a real Sendbird backend, on every PR. Requires repo secrets E2E_APP_ID and
# E2E_PLATFORM_API_TOKEN; a PR from a fork cannot read them, so the suite skips and the job stays
# green there. On an internal PR the credentials must be present — a silent all-skip run would
# report green while testing nothing, so the job fails instead.
#
# Make `E2E` (the summary job at the bottom) the required check, not the sharded `e2e` jobs —
# their names carry the shard index and change whenever TOTAL_SHARDS does.
on:
  pull_request:
    types: [opened, synchronize]

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Shard count. Change BOTH this and the `matrix.shard` list below — they must match.
# Sharding splits only the test execution; each shard still pays install, browser and dev-server
# startup. It also multiplies concurrent load on the one test application
# (TOTAL_SHARDS x playwright workers), so raise it only after confirming the backend tolerates it —
# added flakiness can outweigh the speedup.
env:
  TOTAL_SHARDS: 3

jobs:
  e2e:
    name: shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # External backstop. Playwright's own timeouts cover a stuck test, not a run wedged before the
    # reporter exists (a webServer that never boots, a saturated backend).
    timeout-minutes: 30
    strategy:
      # One failing shard must not cancel the others — the merged report should show every result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
      E2E_PLATFORM_API_TOKEN: ${{ secrets.E2E_PLATFORM_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Enable Corepack (Yarn 3)
        run: corepack enable

      - name: Require credentials on internal PRs
        if: ${{ github.event.pull_request.head.repo.fork != true && (env.E2E_APP_ID == '' || env.E2E_PLATFORM_API_TOKEN == '') }}
        run: |
          echo "::error::E2E secrets are missing. The suite would skip every test and report green."
          exit 1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser (chromium)
        run: yarn playwright install --with-deps chromium

      # Each shard reports to a blob; the merge job turns all of them into one HTML report.
      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }})
        run: yarn test:e2e --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-report:
    name: Merge report
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Enable Corepack (Yarn 3)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: yarn playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Single stable check name for branch protection. Green only when every shard passed.
  e2e-result:
    name: E2E
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard passed
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "::error::E2E shards did not all pass (result: ${{ needs.e2e.result }})."
          exit 1
      - run: echo "All E2E shards passed."
